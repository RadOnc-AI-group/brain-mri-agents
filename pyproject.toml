[project]
name = "brain-mri-agents"
version = "0.1.0"
description = "Agentic Large Language Models for Training-Free Neuro-Radiological Image Analysis"
readme = "README.md"
requires-python = ">=3.11, <3.12"
dependencies = [
    "antspyx==0.6.1",
    "brats==0.0.15",
    "lmstudio==1.5.0",
    "loguru==0.7.3",
    "matplotlib==3.7.3",
    "nibabel==5.3.3",
    "numpy==1.26.4",
    "openai==2.21.0",
    "openai-agents==0.8.4",
    "pandas==2.3.3",
    "panoptica==1.5.1",
    "pydantic==2.12.5",
    "pyyaml>=5.4.1",
    "pyradiomics==3.0.1",
    "rich==13.6.0",
    "scikit-image==0.22.0",
    "scipy==1.11.4",
    "simpleitk==2.4.1",
    "torch==2.6.0",
    "torchio==0.19.1",
    "tqdm==4.67.1",
    "weave==0.52.28",
]

[tool.uv]
package = false

[tool.uv.extra-build-dependencies]
pyradiomics = ["numpy==1.26.4"]
